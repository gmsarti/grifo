[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
markers =
    prompt_contract: testes que verificam strings internas de prompts (frágeis). Excluir com: pytest -m "not prompt_contract"
    llm: testes que invocam o LLM real (lentos, requerem API key). Excluir com: pytest -m "not llm"
