name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras --dev

    - name: Run Ruff check
      run: uv run ruff check .

    - name: Run Unit Tests
      env:
        # Usamos chaves "dummy" para passar pela validação do Pydantic/LangChain
        # durante a coleta dos testes unitários, já que chaves reais não são
        # necessárias para mocks de unidade.
        OPENAI_API_KEY: "dummy"
        TAVILY_API_KEY: "dummy"
        MODEL_PROVIDER: "openai"
        CHROMA_PERSIST_DIRECTORY: "./data/chroma_test"
      run: uv run pytest tests/unit
