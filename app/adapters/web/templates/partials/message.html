<div class="group/msg w-full max-w-2xl mx-auto flex flex-col gap-3 {% if role == 'assistant' %}staggered-reveal font-lora{% else %}font-mono text-sm uppercase tracking-widest opacity-90 pl-12{% endif %}">
    <div class="flex items-center gap-3 mb-1">
        {% if role == 'assistant' %}
            <div class="w-2 h-[1px] bg-terracotta/60"></div>
            <span class="font-mono text-[10px] uppercase tracking-[0.3em] text-terracotta font-bold">O Grifo</span>
        {% else %}
             <span class="font-mono text-[10px] uppercase tracking-[0.3em] text-coffee/60">Investigador</span>
        {% endif %}
    </div>

    <div class="{% if role == 'assistant' %}text-lg leading-relaxed text-coffee{% else %}text-xs text-coffee/80 bg-coffee/5 p-4 border-l border-coffee/20 italic{% endif %}">
        {{ content | safe }}
    </div>
    
    {% if role == 'assistant' %}
    <div class="flex items-center gap-6 mt-4 opacity-0 group-hover/msg:opacity-100 transition-opacity">
        <button class="font-mono text-[9px] uppercase tracking-widest text-coffee/60 hover:text-terracotta transition-colors">Anotar</button>
        <button class="font-mono text-[9px] uppercase tracking-widest text-coffee/60 hover:text-terracotta transition-colors">Citar</button>
    </div>
    {% endif %}
</div>
