<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Grifo - Research Assistant{% endblock %}</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: '#F9F7F2',
                        coffee: '#2C1E1A',
                        terracotta: '#A34E39',
                        sage: '#6B705C',
                    },
                    fontFamily: {
                        fraunces: ['Fraunces', 'serif'],
                        lora: ['Lora', 'serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    {% block head %}{% endblock %}
</head>
<body class="bg-parchment text-coffee font-lora antialiased min-h-screen relative">
    <div class="grain-overlay" aria-hidden="true"></div>
    
    <div class="flex h-screen overflow-hidden relative z-10">
        <!-- Sidebar (Minimal) -->
        <aside class="w-20 lg:w-64 border-r border-coffee/10 flex flex-col shrink-0 bg-parchment/50 backdrop-blur-sm">
            <div class="p-4 lg:p-6">
                <div class="flex items-center gap-3 mb-10 overflow-hidden">
                    <div class="w-10 h-10 border border-coffee flex items-center justify-center shrink-0">
                        <i data-lucide="library" class="w-5 h-5 text-coffee"></i>
                    </div>
                    <span class="font-fraunces font-bold text-xl tracking-tight hidden lg:block uppercase transition-all">Grifo</span>
                </div>
                
                <nav class="space-y-4">
                    <a href="/web/" class="flex items-center gap-4 group">
                        <div class="w-10 h-10 flex items-center justify-center group-hover:bg-coffee/5 transition-colors">
                            <i data-lucide="scroll" class="w-5 h-5 text-coffee"></i>
                        </div>
                        <span class="font-mono text-xs uppercase tracking-widest hidden lg:block">Library</span>
                    </a>
                    <a href="#" class="flex items-center gap-4 group">
                        <div class="w-10 h-10 flex items-center justify-center group-hover:bg-coffee/5 transition-colors">
                            <i data-lucide="feather" class="w-5 h-5 text-coffee/80"></i>
                        </div>
                        <span class="font-mono text-xs uppercase tracking-widest text-coffee/80 hidden lg:block">Drafts</span>
                    </a>
                    <a href="#" class="flex items-center gap-4 group">
                        <div class="w-10 h-10 flex items-center justify-center group-hover:bg-coffee/5 transition-colors">
                            <i data-lucide="search" class="w-5 h-5 text-coffee/80"></i>
                        </div>
                        <span class="font-mono text-xs uppercase tracking-widest text-coffee/80 hidden lg:block">Archives</span>
                    </a>
                </nav>
            </div>
            
            <div class="mt-auto p-4 lg:p-6 border-t border-coffee/5">
                <div class="flex items-center justify-between group">
                    <div class="flex items-center gap-4 cursor-pointer">
                        <div class="w-10 h-10 border border-coffee/20 flex items-center justify-center group-hover:bg-coffee/5 transition-colors">
                            <i data-lucide="user" class="w-5 h-5 text-coffee/80"></i>
                        </div>
                        <div class="hidden lg:block overflow-hidden transition-all">
                            <p class="font-mono text-[10px] uppercase tracking-tighter text-coffee/50">Researcher</p>
                            <p class="font-lora text-sm truncate">{{ current_user.full_name if current_user else "Guest" }}</p>
                        </div>
                    </div>
                    
                    <form action="/web/logout" method="post" class="hidden lg:block">
                        <button type="submit" class="w-8 h-8 flex items-center justify-center hover:bg-terracotta/10 rounded transition-colors" title="Logout">
                            <i data-lucide="log-out" class="w-4 h-4 text-terracotta/60"></i>
                        </button>
                    </form>
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col overflow-hidden">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Init Lucide icons
        lucide.createIcons();
        
        // Handle HTMX content swaps for icons
        document.body.addEventListener('htmx:afterSwap', function() {
            lucide.createIcons();
        });
    </script>
</body>
</html>
