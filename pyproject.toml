[project]
name = "agent-grifo"
version = "0.1.0"
description = "3-Tier Agent Architecture with LangChain and ChromaDB"
requires-python = ">=3.12"
dependencies = [
    "bcrypt<4.1.0",
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.5.4",
    "docx2txt>=0.9",
    "email-validator>=2.3.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.17",
    "langchain-openai>=1.1.10",
    "langchain-tavily>=0.2.17",
    "langchain-text-splitters>=1.1.1",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.8.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "rank-bm25>=0.2.2",
    "streamlit>=1.55.0",
    "tavily-python>=0.7.22",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pre-commit>=4.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.9.9",
    "sqlalchemy[asyncio]>=2.0.48",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
dev = "app.cli.dev:main"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Apenas o essencial: Erros (E), Pyflakes (F) e Isort (I)
select = ["E", "F", "I"]
ignore = ["E501"] # Ignorar linha muito longa (deixa o formatador cuidar)

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
